name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build
        run: go build ./cmd/...

      - name: Test
        run: go test ./internal/... -v -count=1

      - name: Vet
        run: go vet ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o pyrunner${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/pyrunner/

      - name: Build Daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o pyrunnerd${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/pyrunnerd/

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE="pyrunner-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${ARCHIVE}.zip" pyrunner.exe pyrunnerd.exe
          else
            tar czf "${ARCHIVE}.tar.gz" pyrunner pyrunnerd
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip

  publish-npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd npm
          TAG=${GITHUB_REF#refs/tags/v}
          npm version $TAG --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
