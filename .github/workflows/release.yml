name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun scripts/build.ts platform ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/platforms/${{ matrix.target }}/

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          path: dist/platforms

      - run: |
          mkdir -p dist/platforms/windows-x64
          mkdir -p dist/platforms/linux-x64
          mkdir -p dist/platforms/darwin-arm64
          mkdir -p dist/platforms/darwin-x64

      - name: Verify artifacts
        run: |
          ls -la dist/platforms/*/

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          for target in windows-x64 linux-x64 darwin-arm64; do
            echo "Publishing @dropguard/pyrunner-${target}..."
            cd dist/platforms/${target}
            npm publish --access public || echo "Already published or failed"
            cd ../..
          done

      - name: Prepare main package
        run: bun scripts/build.ts publish

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          npm publish dist/publish/ --access public

  github-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/platforms

      - name: Rename binaries for release
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv dist/platforms/windows-x64/pyrunner.exe dist/platforms/windows-x64/pyrunner-${VERSION}-windows-x64.exe
          mv dist/platforms/linux-x64/pyrunner dist/platforms/linux-x64/pyrunner-${VERSION}-linux-x64
          mv dist/platforms/darwin-arm64/pyrunner dist/platforms/darwin-arm64/pyrunner-${VERSION}-darwin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/platforms/*/*pyrunner*
          generate_release_notes: true
